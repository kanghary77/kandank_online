<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Cetak Laporan Absensi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body onload="window.print()" class="bg-white p-4">
    <div class="text-center mb-4">
        <h3>LAPORAN REKAPITULASI ABSENSI SISWA</h3>
        <p class="text-muted">Sistem Absensi Sekolah</p>
    </div>
    <table class="table table-bordered align-middle">
        <thead class="table-dark">
            <tr>
                <th>No</th>
                <th>NIS</th>
                <th>Nama Lengkap</th>
                <th>Kelas</th>
                <th>Tanggal</th>
                <th>Jam</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for a in absen %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ a.nis }}</td>
                <td>{{ a.nama }}</td>
                <td>{{ a.kelas }}</td>
                <td>{{ a.tanggal }}</td>
                <td>{{ a.jam }}</td>
                <td>{{ a.status }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
